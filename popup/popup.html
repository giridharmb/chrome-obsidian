<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obsidian Bookmarker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="../icons/icon32.png" alt="" width="20" height="20">
      <span>Obsidian Bookmarker</span>
      <span id="status" class="dot" title="Checking connection…"></span>
    </div>
    <div class="icons">
      <button id="btn-panel" class="icon" title="Open in side panel">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
      <button id="btn-open" class="icon" title="Open bookmarks note in Obsidian">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      </button>
      <button id="btn-options" class="icon" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button data-tab="save" class="active" role="tab">Save</button>
    <button data-tab="browse" role="tab">Bookmarks <span id="count" class="count"></span></button>
    <button data-tab="search" role="tab">Search vault</button>
  </nav>

  <div id="banner" class="banner" hidden></div>

  <main>
    <section id="tab-save">
      <div id="dupe" class="notice" hidden></div>

      <label class="field">
        <span>Title</span>
        <input id="title" autocomplete="off">
      </label>
      <div class="url-row">
        <img id="fav" alt="" width="16" height="16">
        <span id="url" class="url"></span>
      </div>

      <div class="field">
        <span>Section</span>
        <div id="cats" class="chips"></div>
      </div>

      <label class="field">
        <span>Tags</span>
        <input id="tags" placeholder="ai  research  to-try" autocomplete="off">
      </label>
      <div id="tag-suggest" class="chips small"></div>

      <label class="field">
        <span>Note</span>
        <textarea id="note" rows="2" placeholder="Why is this worth keeping?"></textarea>
      </label>

      <div id="sel-wrap" class="field" hidden>
        <label class="check"><input type="checkbox" id="use-sel" checked> Include highlighted text</label>
        <blockquote id="sel"></blockquote>
      </div>

      <div class="toggles">
        <label class="check" title="Adds a - [ ] checkbox so you can tick it off later"><input type="checkbox" id="readlater"> Read later</label>
        <label class="check" title="Also creates a dedicated note with metadata, highlights and notes"><input type="checkbox" id="dedicated"> Create its own note</label>
      </div>

      <details class="preview">
        <summary>Markdown preview → <span id="target"></span></summary>
        <pre id="preview"></pre>
      </details>

      <div class="actions">
        <button id="save" class="primary">Save <kbd id="kbd">⌘↵</kbd></button>
        <button id="save-open">Save &amp; open in Obsidian</button>
      </div>
    </section>

    <section id="tab-browse" hidden>
      <div class="row">
        <input id="filter" type="search" placeholder="Filter by title, domain, #tag…" autocomplete="off">
        <select id="show">
          <option value="all">All</option>
          <option value="unread">Read later</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div id="list" class="list"></div>
    </section>

    <section id="tab-search" hidden>
      <form id="search-form" class="row">
        <input id="q" type="search" placeholder="Search notes in your vault…" autocomplete="off">
        <button type="submit">Search</button>
      </form>
      <div id="results" class="list"></div>
      <div id="note-view" hidden>
        <div class="note-bar">
          <button id="back">← Back</button>
          <span id="note-title"></span>
          <button id="note-open" class="primary small">Open in Obsidian</button>
        </div>
        <article id="note-body" class="md"></article>
      </div>
    </section>
  </main>

  <div id="toast" role="status"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
